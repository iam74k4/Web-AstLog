name = "noctifex"
main = "src/index.tsx"
compatibility_date = "2026-09-01"

# 本番は独自ドメイン。DNS が Cloudflare 管理下にあるので custom domain として割り当てる。
routes = [{ pattern = "noctifex.dev", custom_domain = true }]

# public/ の中身は Worker より先に配られる（/app.css, /assets/...）。
# それ以外のパスが Worker に落ちてくる。
[assets]
directory = "./public"

# --- 作成してから id を入れること --------------------------------------
#   wrangler d1 create noctifex
#   wrangler kv namespace create MEDIA
# ローカル（wrangler dev）は id を見ないので、この値のままでも動く。
[[d1_databases]]
binding = "DB"
database_name = "noctifex"
database_id = "TO_BE_CREATED"
migrations_dir = "drizzle"

[[kv_namespaces]]
# アバター画像と、ログイン試行回数
binding = "MEDIA"
id = "TO_BE_CREATED"

# SETUP_TOKEN は secret で渡す（最初の owner を作るときだけ使う）
#   wrangler secret put SETUP_TOKEN

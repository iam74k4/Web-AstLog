name: check

on:
  push:
    branches: ['**']
  pull_request:
  # deploy.yml が本番へ出す前に、これと同じ門（型・lint・テスト・写しの戻し・ビルド・fit・contrast・motion）を
  # そのまま呼ぶ。門を2か所に書き写すと、片方だけ弱くなる（以前の deploy は型とテストしか
  # 通していなかった）
  workflow_call:

# 同じブランチに続けて push したら、前の実行は捨てる。
# 名前に event_name を入れるのは、deploy から呼ばれた実行（workflow_dispatch）を
# 同じ main への push の実行と同じ組にしないため——組が同じだと、push が deploy の
# 門を取り消してしまう
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 読むだけ。secret も使わない（本番のトークンは deploy.yml の environment の中にだけある）
permissions:
  contents: read

# action は commit の SHA で固定する（deploy.yml の頭と同じ理由・同じ引き方）

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型
        run: npm run typecheck

      - name: 書式とlint
        run: npm run lint

      # 本物の workerd で動かす。D1 と KV も実体が立つ
      - name: テスト
        run: npm test

      # deploy が残す D1 の写し（定義と中身の2本）が、空の D1 に戻せるか。使い捨ての
      # D1 に seed と上限ちょうどの fixture を入れ、deploy と同じ形で export して、
      # README の「戻す」の順で流し、全部の表の全部の行を突き合わせる。
      # 1本の export は戻せなかった（子の表の行が親の CREATE より前に来る）
      - name: 写しから戻せるか
        run: npm run check:restore

      # デプロイせずに、束ねられるところまで確かめる
      - name: ビルド
        run: npx wrangler deploy --dry-run

  # 実際に描いてみないと分からない3つを、ブラウザで測る。
  # 「公開ページのレイアウト（横にはみ出さない・切られない・目次が貼り付く）」と、
  # 「入口と締めの軌道図のまわりで文字が読める」、装飾の開始と同期。
  #
  # 上の4つはどれも版面を見ない——vitest は workerd の上で動くので、
  # そもそも組むエンジンが居ない。
  #
  # job を分けてあるのは、落ちたときに「型が通らない」のか
  # 「画面が壊れている」のかを一目で分けるため。ブラウザを1つ入れるので
  # 上の job より時間がかかるが、並んで走るので待ちは増えない。
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright は元から devDependencies に入っている。実体の chromium だけ入れる
      - name: ブラウザ
        run: npx playwright install --with-deps chromium

      # scripts/check-fit.mjs が、使い捨ての D1 を4つ（seed・seed＋ブロック3本・上限
      # ちょうどの複数人のサイト・同じ中身の1人のサイト）作って wrangler dev を順に立て、
      # 終わったら落とす。上限ちょうどの中身は scripts/lib/fit-fixture.mjs が
      # src/blocks.ts の上限から作る。3書体 × 3寸法 × 訪問者 / ログインの姿で測る
      - name: レイアウト（はみ出し・切り取り・目次の貼り付け）
        run: npm run check:fit

      # 空の DB では、軌道図のまわりの字（入口の札と件数・Contact）が生えない。check:contrast は
      # 手元の D1（--local の既定の置き場）をそのまま読む
      - name: ローカル D1 を用意する
        run: |
          npm run db:migrate:local
          npm run db:seed:local

      # 同じブラウザで、もう1つの「実際に描いてみないと分からない」不変条件を測る。
      # 入口と締めの軌道図のまわりで、見出し・リード文・札・件数が読めるか（WCAG 1.4.3）と、
      # 軌道図とブラックホールが出ていること。光は白、字は #f2f2f4 なので、置き方を
      # 間違えると白の上の白になる——前の入口の月では、リード文が 1.00:1（背景と同じ
      # 明るさ＝消えている）だった。
      # job を分けないのは、ブラウザの用意と D1 の seed をそのまま使えるため。
      - name: 軌道図のまわりで文字が読めるか
        run: npm run check:contrast

      - name: 装飾の開始順・同期・CSP・動きを減らす設定
        run: npm run check:motion

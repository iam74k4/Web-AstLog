name: check

on:
  push:
    branches: ['**']
  pull_request:
  # deploy.yml が本番へ出す前に、これと同じ門（型・lint・テスト・写しの戻し・ビルド・fit・admin）を
  # そのまま呼ぶ。門を2か所に書き写すと、片方だけ弱くなる（以前の deploy は型とテストしか
  # 通していなかった）
  workflow_call:

# 同じブランチに続けて push したら、前の実行は捨てる。
# 名前に event_name を入れるのは、deploy から呼ばれた実行（workflow_dispatch）を
# 同じ main への push の実行と同じ組にしないため——組が同じだと、push が deploy の
# 門を取り消してしまう
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# 読むだけ。secret も使わない（本番のトークンは deploy.yml の environment の中にだけある）
permissions:
  contents: read

# action は commit の SHA で固定する（deploy.yml の頭と同じ理由・同じ引き方）

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型
        run: npm run typecheck

      - name: 書式とlint
        run: npm run lint

      # 本物の workerd で動かす。D1 と KV も実体が立つ
      - name: テスト
        run: npm test

      # deploy が残す D1 の写し（定義と中身の2本）が、空の D1 に戻せるか。使い捨ての
      # D1 に seed と上限ちょうどの fixture を入れ、deploy と同じ形で export して、
      # README の「戻す」の順で流し、全部の表の全部の行を突き合わせる。
      # 1本の export は戻せなかった（子の表の行が親の CREATE より前に来る）
      - name: 写しから戻せるか
        run: npm run check:restore

      - name: 削除画像の控えと復元を検証する
        run: npm run check:media-restore

      # デプロイせずに、束ねられるところまで確かめる
      - name: ビルド
        run: npx wrangler deploy --dry-run

  # 実際に描いてみないと分からない2つを、ブラウザで測る。
  # 「公開ページのレイアウト（横にはみ出さない・切られない・目次が貼り付く）」と、
  # 「管理画面の実フォーム（入力・競合・プレビュー・スマホ表示）」。
  #
  # 上の4つはどれも版面を見ない——vitest は workerd の上で動くので、
  # そもそも組むエンジンが居ない。
  #
  # job を分けてあるのは、落ちたときに「型が通らない」のか
  # 「画面が壊れている」のかを一目で分けるため。ブラウザを1つ入れるので
  # 上の job より時間がかかるが、並んで走るので待ちは増えない。
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright は元から devDependencies に入っている。実体の chromium だけ入れる
      - name: ブラウザ
        run: npx playwright install --with-deps chromium

      # scripts/check-fit.mjs が、使い捨ての D1 を4つ（seed・seed＋ブロック3本・上限
      # ちょうどの複数人のサイト・同じ中身の1人のサイト）作って wrangler dev を順に立て、
      # 終わったら落とす。上限ちょうどの中身は scripts/lib/fit-fixture.mjs が
      # src/blocks.ts の上限から作る。3書体 × 3寸法 × 訪問者 / ログインの姿で測る
      - name: レイアウト（はみ出し・切り取り・目次の貼り付け）
        run: npm run check:fit

      # check:admin も使い捨ての D1 と KV を自分で作って測る（手元の D1 には触らない）
      - name: 管理画面の入力・競合・プレビュー・スマホ表示
        run: npm run check:admin

name: check

on:
  push:
    branches: ['**']
  pull_request:
  # deploy.yml が本番へ出す前に、これと同じ門（型・lint・テスト・ビルド・fit・contrast）を
  # そのまま呼ぶ。門を2か所に書き写すと、片方だけ弱くなる（以前の deploy は型とテストしか
  # 通していなかった）
  workflow_call:

# 同じブランチに続けて push したら、前の実行は捨てる。
# 名前に event_name を入れるのは、deploy から呼ばれた実行（workflow_dispatch）を
# 同じ main への push の実行と同じ組にしないため——組が同じだと、push が deploy の
# 門を取り消してしまう
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型
        run: npm run typecheck

      - name: 書式とlint
        run: npm run lint

      # 本物の workerd で動かす。D1 と KV も実体が立つ
      - name: テスト
        run: npm test

      # デプロイせずに、束ねられるところまで確かめる
      - name: ビルド
        run: npx wrangler deploy --dry-run

  # 実際に描いてみないと分からない2つを、ブラウザで測る。
  # 「公開ページはスクロールしない」と、「入口の月の上で文字が読める」。
  #
  # 上の4つはどれも版面を見ない——vitest は workerd の上で動くので、
  # そもそも組むエンジンが居ない。この機能の名前そのものである不変条件を、
  # CI で確かめる手段がここまで1つも無かった。
  #
  # job を分けてあるのは、落ちたときに「型が通らない」のか
  # 「画面が壊れている」のかを一目で分けるため。ブラウザを1つ入れるので
  # 上の job より時間がかかるが、並んで走るので待ちは増えない。
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright は元から devDependencies に入っている。実体の chromium だけ入れる
      - name: ブラウザ
        run: npx playwright install --with-deps chromium

      # scripts/check-fit.mjs が、使い捨ての D1 を3つ（seed・上限ちょうどの複数人の
      # サイト・同じ中身の1人のサイト）作って wrangler dev を順に立て、終わったら落とす。
      # 上限ちょうどの中身は scripts/lib/fit-fixture.mjs が src/blocks.ts の上限から作る
      # ——seed だけを測っていたころは、打ち込むブロックも 3人以上の Team も本文の画面も
      # 一度も測られていなかった。3書体 × 3骨格 × 3寸法 × 訪問者 / ログインの姿で測る
      - name: 画面に収まっているか
        run: npm run check:fit

      # 空の DB では、月の上に乗る字（入口の帯・Contact）が生えない。check:contrast は
      # 手元の D1（--local の既定の置き場）をそのまま読む
      - name: ローカル D1 を用意する
        run: |
          npm run db:migrate:local
          npm run db:seed:local

      # 同じブラウザで、もう1つの「実際に描いてみないと分からない」不変条件を測る。
      # 入口の背景の月の上で、見出しとリード文が読めるか（WCAG 1.4.3）。
      # 月は白い粒子、見出しは #f2f2f4 なので、置き方を間違えると白の上の白に
      # なる——実際にリード文が 1.00:1（背景と同じ明るさ＝消えている）だった。
      # job を分けないのは、ブラウザの用意と D1 の seed をそのまま使えるため。
      - name: 月の上で文字が読めるか
        run: npm run check:contrast

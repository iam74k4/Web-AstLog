name: deploy

# 自動では動かさない。Actions の画面から手で実行する。
# push のたびに本番が入れ替わるのは、まだ望んでいないため。
# 自動デプロイに切り替えるなら on: push: branches: [main] を足す。
on:
  workflow_dispatch:
    inputs:
      migrate:
        description: 'D1 のマイグレーションも流す'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 壊れたものを本番に出さない
      - run: npm run typecheck
      - run: npm test

      - name: マイグレーション
        if: inputs.migrate
        run: npx wrangler d1 migrations apply noctifex --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: デプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
